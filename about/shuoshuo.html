<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吐个槽吧</title>
<style>
  :root {
    --bg: #f8f5f0; --card-bg: #ffffff; --text: #2c2416;
    --text-secondary: #8b7e6a; --border: #e8e0d5;
    --accent: #d4956b; --accent-hover: #c17d52; --accent-light: #fdf0e8;
    --danger: #d35a3a; --danger-bg: #fce8e3;
    --shadow: 0 1px 3px rgba(44,36,22,0.06); --shadow-lg: 0 4px 16px rgba(44,36,22,0.1);
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  [data-theme="dark"] {
    --bg: #1a1815; --card-bg: #252320; --text: #e8dfd0;
    --text-secondary: #9b8e7a; --border: #3a3530;
    --accent: #d4956b; --accent-hover: #e0a880; --accent-light: #3a2a20;
    --danger: #e07050; --danger-bg: #3a2020;
    --shadow: 0 1px 3px rgba(0,0,0,0.25); --shadow-lg: 0 4px 16px rgba(0,0,0,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    min-height: 100vh; line-height: 1.6;
  }

  /* Layout */
  .app { max-width: 1100px; margin: 0 auto; padding: 20px 24px 40px; }
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0 28px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .app-header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  .layout {
    display: flex; gap: 28px; align-items: flex-start;
  }
  .feed-col { flex: 1; min-width: 0; }
  .sidebar { width: 370px; flex-shrink: 0; position: sticky; top: 20px; }

  @media (max-width: 860px) {
    .layout { flex-direction: column-reverse; }
    .sidebar { width: 100%; position: static; }
    .app { padding: 12px 10px 30px; }
    .app-header { padding: 10px 0 18px; margin-bottom: 16px; }
    .app-header h1 { font-size: 22px; }
  }

  /* Buttons */
  .btn {
    padding: 9px 20px; border: none; border-radius: 20px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: var(--font);
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--text-secondary);
    padding: 6px 12px; font-weight: 500; font-size: 13px;
  }
  .btn-ghost:hover { color: var(--text); background: var(--border); }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 14px; }

  .icon-btn {
    width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 50%;
    background: var(--card-bg); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--text-secondary); transition: all 0.2s;
    flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .icon-btn.small { width: 28px; height: 28px; font-size: 12px; }

  /* Sidebar cards */
  .side-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .side-card h3 {
    font-size: 14px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px;
  }

  /* Post form */
  .post-textarea {
    width: 100%; min-height: 120px; border: none; outline: none;
    resize: vertical; font-family: var(--font); font-size: 15px;
    line-height: 1.7; color: var(--text); background: transparent;
  }
  .post-textarea::placeholder { color: var(--text-secondary); }

  .image-previews {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
  }
  .image-previews .preview-item {
    position: relative; width: 80px; height: 80px;
    border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
  }
  .image-previews .preview-item img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .image-previews .preview-item .remove-img {
    position: absolute; top: 2px; right: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,0.5); color: #fff; border: none;
    cursor: pointer; font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }

  .form-toolbar {
    display: flex; gap: 6px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--border); align-items: center;
  }
  .form-toolbar .spacer { flex: 1; }
  .char-count { font-size: 13px; color: var(--text-secondary); }
  .char-count.warn { color: var(--danger); }

  /* Emoji picker */
  .emoji-picker {
    display: none; flex-wrap: wrap; gap: 4px; padding: 10px;
    max-height: 200px; overflow-y: auto; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    margin-top: 8px;
  }
  .emoji-picker.show { display: flex; }
  .emoji-picker button {
    width: 34px; height: 34px; border: none; background: transparent;
    cursor: pointer; font-size: 20px; border-radius: 6px;
    transition: background 0.15s; display: flex; align-items: center; justify-content: center;
  }
  .emoji-picker button:hover { background: var(--border); }

  /* Feed */
  .feed { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: var(--shadow-lg); }

  .card-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .card-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent-light); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; flex-shrink: 0;
  }
  .card-user { font-size: 14px; font-weight: 600; }
  .card-time {
    font-size: 12px; color: var(--text-secondary); margin-left: auto;
    white-space: nowrap;
  }
  .card-time .edited { font-style: italic; }

  .card-body {
    font-size: 15px; line-height: 1.8; white-space: pre-wrap; word-break: break-word;
  }
  .card-images {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
  }
  .card-images img {
    max-width: 100%; max-height: 300px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; object-fit: cover;
    transition: transform 0.2s;
  }
  .card-images img:hover { transform: scale(1.02); }

  .card-footer {
    display: flex; align-items: center; margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .card-footer .card-actions {
    display: flex; gap: 4px; margin-left: auto;
  }

  /* Edit mode */
  .edit-textarea {
    width: 100%; min-height: 80px; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-family: var(--font);
    font-size: 15px; line-height: 1.7; color: var(--text);
    background: var(--bg); resize: vertical; outline: none;
  }
  .edit-textarea:focus { border-color: var(--accent); }

  /* Daily quote */
  .daily-quote-card { text-align: center; }
  .daily-quote-card .quote-text {
    font-size: 18px; line-height: 1.8; color: var(--text);
    font-weight: 500; margin-bottom: 10px;
    font-style: italic;
  }
  .daily-quote-card .quote-author {
    font-size: 13px; color: var(--text-secondary);
  }
  .daily-quote-card .quote-author::before { content: '—— '; }

  /* Toolbar */
  .feed-toolbar {
    display: flex; gap: 8px; margin-bottom: 16px; align-items: center;
  }
  .search-input {
    flex: 1; padding: 8px 14px; border: 1px solid var(--border);
    border-radius: 20px; font-size: 14px; font-family: var(--font);
    background: var(--card-bg); color: var(--text); outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-secondary); }

  /* Empty */
  .empty {
    text-align: center; padding: 60px 20px; color: var(--text-secondary);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
  .empty-text { font-size: 15px; }

  /* Pagination */
  .pagination {
    display: flex; justify-content: center; align-items: center; gap: 4px;
    margin-top: 24px; flex-wrap: wrap;
  }
  .pagination button {
    min-width: 36px; height: 36px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card-bg); cursor: pointer;
    font-size: 13px; font-family: var(--font); color: var(--text);
    transition: all 0.15s; display: flex; align-items: center; justify-content: center;
    padding: 0 8px;
  }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
  .pagination button.active {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  .pagination .page-info {
    font-size: 13px; color: var(--text-secondary); padding: 0 8px;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 24px;
    border-radius: 20px; font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
    transition: opacity 0.3s; z-index: 100;
  }
  .toast.show { opacity: 1; }

  /* Modal for image preview */
  .lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 200; align-items: center; justify-content: center; cursor: pointer;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

  /* Fun animations */
  @keyframes bounce-wobble {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    15% { transform: translateY(-8px) rotate(-3deg) scale(1.08); }
    30% { transform: translateY(0) rotate(3deg) scale(0.95); }
    50% { transform: translateY(-5px) rotate(-2deg) scale(1.05); }
    70% { transform: translateY(0) rotate(2deg) scale(0.97); }
    85% { transform: translateY(-3px) rotate(-1deg) scale(1.02); }
  }
  @keyframes float-spin {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-6px) rotate(5deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(6px) rotate(-5deg); }
  }
  @keyframes pulse-glow {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.25); opacity: 1; }
  }
  .header-gif {
    display: inline-block; font-size: 38px; margin-left: 8px;
    animation: bounce-wobble 1.8s ease-in-out infinite;
    cursor: default; user-select: none; vertical-align: middle;
  }
  .quote-gif-wrap {
    text-align: center; margin-top: 14px; font-size: 42px;
    animation: float-spin 3s ease-in-out infinite;
    cursor: default; user-select: none;
  }
  .quote-gif-wrap .sparkle {
    display: inline-block; animation: pulse-glow 1.5s ease-in-out infinite;
  }
  .quote-gif-wrap .sparkle:nth-child(2) { animation-delay: 0.5s; }
  .quote-gif-wrap .sparkle:nth-child(3) { animation-delay: 1s; }

  /* Settings modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 300; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; width: 380px;
    max-width: 90vw; box-shadow: var(--shadow-lg);
  }
  .modal h2 { font-size: 18px; margin-bottom: 20px; }
  .modal label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  .modal input {
    width: 100%; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: var(--font);
    background: var(--bg); color: var(--text); outline: none; margin-bottom: 14px;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal .modal-hint { font-size: 12px; color: var(--text-secondary); margin: -8px 0 14px; line-height: 1.5; }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal .sync-note { font-size: 13px; color: var(--accent); margin-top: 12px; }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="app-header">
    <h1>吐个槽吧<span class="header-gif" id="headerGif">🐸</span></h1>
    <div class="header-right">
      <span id="myName" style="font-size:14px;color:var(--text-secondary)"></span>
      <button class="icon-btn" id="themeBtn" title="切换深色/浅色">🌙</button>
      <button class="icon-btn" id="settingsBtn" title="同步设置">⚙</button>
    </div>
  </div>

  <!-- Two-column layout -->
  <div class="layout">
    <!-- Left: Feed -->
    <div class="feed-col">
      <div class="feed-toolbar">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索…">
        <span style="font-size:13px;color:var(--text-secondary);white-space:nowrap" id="stats"></span>
      </div>
      <div class="feed" id="feed"></div>
      <div class="pagination" id="pagination"></div>
      <div class="empty" id="empty">
        <div class="empty-icon">💬</div>
        <p class="empty-text">还没有吐槽，在右侧写第一条吧</p>
      </div>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar">
      <!-- Post form -->
      <div class="side-card">
        <h3>发一条吐槽</h3>
        <textarea class="post-textarea" id="postInput" placeholder="不吐不快，尽管说…" maxlength="2000"></textarea>
        <div class="image-previews" id="imagePreviews"></div>
        <div class="emoji-picker" id="emojiPicker"></div>
        <div class="form-toolbar">
          <button class="icon-btn small" id="emojiBtn" title="表情">😊</button>
          <button class="icon-btn small" id="imageBtn" title="插入图片">🖼</button>
          <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none">
          <span class="spacer"></span>
          <span class="char-count" id="charCount">0 / 2000</span>
          <button class="btn btn-primary" id="postBtn" disabled>发布</button>
        </div>
      </div>

      <!-- Daily quote -->
      <div class="side-card daily-quote-card">
        <h3>每日一言</h3>
        <div class="quote-text" id="dailyQuote">加载中…</div>
        <div class="quote-author" id="dailyQuoteAuthor"></div>
        <div class="quote-gif-wrap" id="quoteGifWrap">
          <span class="sparkle">⭐</span><span class="sparkle">✨</span><span class="sparkle">💫</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>同步设置</h2>
    <label>GitHub Token (gist 权限)</label>
    <input type="password" id="modalToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <div class="modal-hint">在 GitHub Settings → Developer settings → Tokens (classic) 创建，仅需勾选 <b>gist</b> 权限。</div>
    <label>Gist ID</label>
    <input type="text" id="modalGistId" placeholder="首次使用留空，保存后自动创建">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalSave">保存并启用同步</button>
    </div>
    <div class="sync-note" id="modalNote"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<script>
(function() {
  const MAX_LENGTH = 2000;
  const MAX_IMG_SIZE = 2 * 1024 * 1024; // 2MB per image
  const GIST_FILENAME = 'shuoshuo-posts.json';
  const STORAGE_KEY = 'shuoshuo_posts';

  // ── DOM ──────────────────────────────
  const $ = function(id) { return document.getElementById(id); };
  const $feed = $('feed'), $empty = $('empty'), $postInput = $('postInput');
  const $postBtn = $('postBtn'), $charCount = $('charCount'), $searchInput = $('searchInput');
  const $stats = $('stats'), $toast = $('toast');
  const $emojiPicker = $('emojiPicker'), $emojiBtn = $('emojiBtn');
  const $imagePreviews = $('imagePreviews'), $imageBtn = $('imageBtn');
  const $imageFileInput = $('imageFileInput');
  const $myName = $('myName');
  const $lightbox = $('lightbox'), $lightboxImg = $('lightboxImg');
  const $pagination = $('pagination');

  // ── State ────────────────────────────
  const PAGE_SIZE = 6;
  let posts = [];
  let editingId = null;
  let pendingImages = [];
  let toastTimer = null;
  let currentPage = 1;

  // Username
  const ADJ = ['快乐的','忧郁的','可爱的','自由的','安静的','温暖的','调皮的','勇敢的','温柔的','潇洒的','迷茫的','坚定的','慵懒的','热情的','冷静的','酷酷的','呆呆的','美美的','憨憨的','萌萌的'];
  const NOUN = ['小猫','小鱼','星星','月亮','微风','阳光','叶子','云朵','小熊','小鹿','海豚','飞鸟','树懒','狐狸','兔子','仓鼠','企鹅','柴犬','布丁','奶茶'];

  function randomName() {
    const a = ADJ[Math.floor(Math.random() * ADJ.length)];
    const n = NOUN[Math.floor(Math.random() * NOUN.length)];
    const num = Math.floor(Math.random() * 90) + 10;
    return a + n + num;
  }

  function getUsername() {
    let name = localStorage.getItem('shuoshuo_username');
    if (!name) { name = randomName(); localStorage.setItem('shuoshuo_username', name); }
    return name;
  }

  const username = getUsername();
  $myName.textContent = '👤 ' + username;

  // ── Persistence ──────────────────────
  function loadLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      posts = raw ? JSON.parse(raw) : [];
      posts = posts.map(normalizePost);
    } catch (e) { posts = []; }
  }

  function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  }

  function normalizePost(p) {
    return {
      id: p.id || genId(),
      content: String(p.content || ''),
      images: Array.isArray(p.images) ? p.images : [],
      author: p.author || username,
      createdAt: p.createdAt || Date.now(),
      updatedAt: p.updatedAt || p.createdAt || Date.now()
    };
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ── GitHub Gist Sync ────────────────
  // Token & Gist ID are stored in localStorage only (never commit to git)
  let githubToken = localStorage.getItem('shuoshuo_gh_token') || '';
  let gistId = localStorage.getItem('shuoshuo_gist_id') || '';
  let syncEnabled = !!(githubToken && gistId);

  async function githubApi(path, opts = {}) {
    const res = await fetch('https://api.github.com' + path, {
      ...opts,
      headers: {
        'Authorization': 'token ' + githubToken,
        'Accept': 'application/vnd.github.v3+json',
        ...(opts.headers || {})
      }
    });
    if (!res.ok) {
      const body = await res.text();
      throw new Error(res.status + ': ' + (body || res.statusText).slice(0, 200));
    }
    return res.json();
  }

  async function pullFromGist() {
    const gist = await githubApi('/gists/' + gistId);
    const file = gist.files[GIST_FILENAME];
    if (!file || !file.content) throw new Error('Gist 中未找到数据文件');
    const remote = JSON.parse(file.content).map(normalizePost);
    const remoteIds = new Set(remote.map(function(p) { return p.id; }));
    const localOnly = posts.filter(function(p) { return !remoteIds.has(p.id); });
    posts = remote.concat(localOnly);
    saveLocal();
    render();
  }

  async function pushToGist() {
    await githubApi('/gists/' + gistId, {
      method: 'PATCH',
      body: JSON.stringify({
        files: { [GIST_FILENAME]: { content: JSON.stringify(posts) } }
      })
    });
  }

  async function doSync() {
    if (!syncEnabled) return;
    try {
      await pullFromGist();
      await pushToGist();
    } catch (e) {
      console.error('Sync error:', e);
    }
  }

  function autoSync() {
    if (!syncEnabled) return;
    doSync().catch(function() {});
  }

  // ── Emoji Picker ─────────────────────
  const EMOJIS = [
    '😀','😃','😄','😁','😅','😂','🤣','😊','😇','🙂','😉','😌','😍','🥰','😘','😗','😋','😛','😜','🤪',
    '😎','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','😣','😖','😫','😩','🥺','😢','😭','😤','😡','🤬',
    '💀','☠','🤡','💩','👍','👎','👏','🙌','🤝','💪','🤞','✌','🤟','👋','🖐','✋','🫶','❤','🧡','💛',

  function insertAtCursor(textarea, text) {

    textarea.selectionStart = textarea.selectionEnd = start + text.length;

    if (file.size > MAX_IMG_SIZE) { showToast('图片不能超过 2MB'); return; }

    if (e.target !== $postInput && e.target.tagName !== 'TEXTAREA') return;
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const blob = item.getAsFile();
        const reader = new FileReader();
        reader.onload = function() { addPendingImage(reader.result); };

  // ── Render ───────────────────────────
  function getFilteredPosts() {
    const q = $searchInput.value.trim().toLowerCase();
    if (!q) return [...posts].reverse();
    return posts.filter(function(p) {
      return p.content.toLowerCase().includes(q) || p.author.toLowerCase().includes(q);
    }).reverse();
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const h = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    if (y === now.getFullYear()) return m + '-' + day + ' ' + h + ':' + min;
    return y + '-' + m + '-' + day;
  }

  function render() {
    const filtered = getFilteredPosts();
    const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filtered.slice(start, start + PAGE_SIZE);

    $stats.textContent = '共 ' + posts.length + ' 条';

    if (filtered.length === 0) {
      $feed.innerHTML = '';
      $pagination.innerHTML = '';
      $empty.style.display = 'block';
    } else {
      $empty.style.display = 'none';
      $feed.innerHTML = pageItems.map(function(p) {
        if (editingId === p.id) return renderEditCard(p);
        return renderCard(p);
      }).join('');
      renderPagination(totalPages);
    }
  }

  function renderPagination(totalPages) {
    if (totalPages <= 1) { $pagination.innerHTML = ''; return; }
    var html = '';
    html += '<button ' + (currentPage === 1 ? 'disabled' : '') + ' data-page="prev">&laquo; 上一页</button>';
    for (var i = 1; i <= totalPages; i++) {
      html += '<button class="' + (i === currentPage ? 'active' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    html += '<button ' + (currentPage === totalPages ? 'disabled' : '') + ' data-page="next">下一页 &raquo;</button>';
    html += '<span class="page-info">' + currentPage + ' / ' + totalPages + '</span>';
    $pagination.innerHTML = html;
  }

  function renderCard(p) {
    const avatarText = p.author.charAt(0);
    return '<div class="card" data-id="' + p.id + '">'
      + '<div class="card-header">'
        + '<div class="card-avatar">' + escapeHtml(avatarText) + '</div>'
        + '<span class="card-user">' + escapeHtml(p.author) + '</span>'
        + '<span class="card-time" title="' + new Date(p.createdAt).toLocaleString() + '">'
          + formatTime(p.createdAt)
          + (p.updatedAt !== p.createdAt ? ' <span class="edited">(编辑过)</span>' : '')
          + '</span>'
      + '</div>'
      + '<div class="card-body">' + escapeHtml(p.content) + '</div>'
      + (p.images && p.images.length ? '<div class="card-images">' + p.images.map(function(img) {
          return '<img src="' + img + '" data-lightbox alt="图片" loading="lazy">';
        }).join('') + '</div>' : '')
      + '<div class="card-footer">'
        + '<span style="font-size:12px;color:var(--text-secondary)">'

  function addPost() {
    const content = $postInput.value.trim();
    if (!content && pendingImages.length === 0) return;
    posts.push({
      id: genId(),
      content: content,
      images: [...pendingImages],
      author: username,
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
    saveLocal();
    $postInput.value = '';
    pendingImages = [];
    renderImagePreviews();
    updateCharCount();
    currentPage = 1;
    render();
    showToast('发布成功');
    autoSync();

  function deletePost(id) {
    if (!confirm('确定删除这条说说吗？')) return;
    posts = posts.filter(function(p) { return p.id !== id; });
    saveLocal();
    render();
    showToast('已删除');
    autoSync();
  }

  function startEdit(id) {
    editingId = id;
    render();
    setTimeout(function() {
      const ta = document.getElementById('editArea-' + id);
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }, 50);
  }

  function cancelEdit() { editingId = null; render(); }

  function saveEdit(id) {
    const ta = document.getElementById('editArea-' + id);
    if (!ta) return;
    const content = ta.value.trim();
    if (!content) { showToast('内容不能为空'); return; }
    const post = posts.find(function(p) { return p.id === id; });
    if (post) { post.content = content; post.updatedAt = Date.now(); }
    editingId = null;
    saveLocal();
    render();
    showToast('已保存');
    autoSync();
  }

  // ── Export / Import ──────────────────
  function exportData() {
    const blob = new Blob([JSON.stringify(posts, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'shuoshuo-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('导出成功');
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) throw new Error('格式错误');
        const merged = data.map(normalizePost);
        const existingIds = new Set(posts.map(function(p) { return p.id; }));
        const newPosts = merged.filter(function(p) { return !existingIds.has(p.id); });
        posts = newPosts.concat(posts);
        saveLocal();
        currentPage = 1;
        render();
        showToast('导入 ' + newPosts.length + ' 条说说');
        autoSync();
      } catch (err) {
        showToast('导入失败：文件格式不正确');
      }
    };
    reader.readAsText(file);
  }

      $emojiPicker.classList.remove('show');

  document.getElementById('modalSave').addEventListener('click', async function() {
    var token = $modalToken.value.trim();
    var gid = $modalGistId.value.trim();
    if (!token) { showToast('请输入 GitHub Token'); return; }
    $modalNote.textContent = '正在连接…';

    try {
      if (gid) {
        // Use existing gist
        githubToken = token;
        gistId = gid;
      } else {
        // Auto-create gist
        githubToken = token;
        gistId = '';
        // Temporarily set to findOrCreate
        var tempToken = githubToken;
        var gists = await (await fetch('https://api.github.com/gists?per_page=100', {
          headers: { 'Authorization': 'token ' + tempToken, 'Accept': 'application/vnd.github.v3+json' }
        })).json();
        if (!Array.isArray(gists)) throw new Error('Token 无效');
        var found = gists.find(function(g) { return g.files && g.files[GIST_FILENAME]; });
        if (found) {
          gistId = found.id;
        } else {
          var created = await (await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: { 'Authorization': 'token ' + tempToken, 'Accept': 'application/vnd.github.v3+json' },
            body: JSON.stringify({
              description: '说说数据 · 自动生成',
              public: false,
              files: (function() { var f = {}; f[GIST_FILENAME] = { content: JSON.stringify(posts) }; return f; })()
            })
          })).json();
          if (!created.id) throw new Error('创建 Gist 失败');
          gistId = created.id;
        }
      }
      localStorage.setItem('shuoshuo_gh_token', githubToken);
      localStorage.setItem('shuoshuo_gist_id', gistId);
      syncEnabled = true;
      await pullFromGist();
      await pushToGist();
      $modalNote.textContent = '同步已启用！Gist: ' + gistId.slice(0, 8) + '…';
      $modalGistId.value = gistId;
      showToast('同步已启用');
    } catch (e) {
      $modalNote.textContent = '失败: ' + e.message;
    }
  });

    ['🔥','💥','💫'],
    ['🦋','🐝','🐞'],
    ['💀','👻','🎃'],
    ['🍕','🍔','🌮'],
    ['🎵','🎶','🎸'],
    ['🌍','🌎','🌏'],
    ['💎','💍','👑'],
    ['🍩','🍪','🍰'],
    ['⚽','🏀','🎾'],
  ];

  function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function initRandomGifs() {
    // Header: pick a random emoji
    var $headerGif = document.getElementById('headerGif');
    if ($headerGif) $headerGif.textContent = randomFrom(HEADER_EMOJIS);

    // Quote card: pick a random 3-emoji set
    var $quoteWrap = document.getElementById('quoteGifWrap');
    if ($quoteWrap) {
      var set = randomFrom(QUOTE_GIF_SETS);
      $quoteWrap.innerHTML = set.map(function(e) {
        return '<span class="sparkle">' + e + '</span>';
      }).join('');
    }
  }

  // ── Init ─────────────────────────────
  const savedTheme = localStorage.getItem('shuoshuo_theme');
  setTheme(savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches));

  // If sync is enabled, pull first, then use local
  (async function init() {
    loadLocal();
    if (syncEnabled) {
      try { await pullFromGist(); } catch (e) { console.error('Init sync error:', e); }
    }
    render();
    initDailyQuote();
    initRandomGifs();
  })();
})();
</script>

</body>
</html>
